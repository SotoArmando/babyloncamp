<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Player</title>
  <link rel="stylesheet" href="ad-play.css?v=play1" />
  <style>
    html, body { height: 100%; }
    #mount { min-height: 100%; display: grid; place-items: center; }
    .player-miss { margin: 0; padding: 1rem; color: #d8d0c4; font: 650 0.85rem/1.4 ui-sans-serif, system-ui, sans-serif; text-align: center; }
  </style>
</head>
<body class="player-embed">
  <div id="mount"></div>
  <script type="importmap">
    { "imports": {
      "@babylonjs/core": "https://esm.sh/@babylonjs/core@7.54.3",
      "@babylonjs/core/": "https://esm.sh/@babylonjs/core@7.54.3/",
      "@babylonjs/loaders": "https://esm.sh/@babylonjs/loaders@7.54.3?external=@babylonjs/core",
      "@babylonjs/loaders/": "https://esm.sh/@babylonjs/loaders@7.54.3/",
      "@babylonjs/loaders/glTF": "https://esm.sh/@babylonjs/loaders@7.54.3/glTF?external=@babylonjs/core",
      "@babylonjs/loaders/glTF/": "https://esm.sh/@babylonjs/loaders@7.54.3/glTF/"
    } }
  </script>
  <script type="module">
    import { adMarkup, playById, formatById } from "./ad-catalog.js?v=cam23";
    import { comboPlayExtras, playRouteParams, resolvePlayCombo } from "./play-route.js?v=5";
    import { bootContainers, startAd, setPropModelFile, setPropModelFiles, preparePropSource } from "./ad-player.js?v=prop43";
    import { listAllAssets, loadAssetFilesForMesh } from "./ad-assets.js";
    import { loadComboPropFiles } from "./ad-profile.js?v=cam24";

    const mount = document.getElementById("mount");
    const route = playRouteParams();
    const item = await resolvePlayCombo(route.id, route.profile);
    if (!item) {
      mount.innerHTML = `<p class="player-miss">Ese clímax no está en el perfil de la galería.</p>`;
    } else {
      const format = formatById(item.ad);
      document.documentElement.style.setProperty("--ad-w", `${format.w}px`);
      document.documentElement.style.setProperty("--ad-h", `${format.h}px`);
      if (playById(item.play).id === "prop" && item.pmesh) {
        let files = [];
        if (item.pmesh.assetId) {
          const catalog = await listAllAssets();
          const asset = catalog.find((entry) => entry.id === item.pmesh.assetId);
          files = asset ? await loadAssetFilesForMesh(asset, catalog) : [];
        } else {
          files = await loadComboPropFiles(item.id);
        }
        if (files.length) {
          setPropModelFiles(files);
          await preparePropSource();
        } else setPropModelFile(null);
      } else {
        setPropModelFile(null);
      }
      mount.innerHTML = adMarkup(format, "serve-ad", item.in || "none", item.play, comboPlayExtras(item));
      mount.querySelector(".ad-slot")?.classList.add("is-in");
      await bootContainers(mount);
      await startAd(mount.querySelector(".ad-container"));
    }
  </script>
</body>
</html>
