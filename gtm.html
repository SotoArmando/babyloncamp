<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GTM preview</title>
  <link rel="stylesheet" href="/app-nav.css?v=nav3" />
  <!--GTM_HEAD-->
  <script>
    (function () {
      if (document.querySelector('script[src*="googletagmanager.com"]')) return;
      var q = new URLSearchParams(location.search);
      var id = String(q.get("gtm") || "").trim().toUpperCase();
      if (!id) {
        try { id = String(localStorage.getItem("gwd-gtm-container") || "").trim().toUpperCase(); } catch (err) { id = ""; }
      }
      if (!/^(GTM|GT|G|AW)-[A-Z0-9]+$/.test(id)) return;
      var gtm = id.indexOf("GTM-") === 0;
      document.write(
        (gtm
          ? "<script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);})(window,document,'script','dataLayer','" + id + "');<\/script>"
          : "") +
        "<script async src='https://www.googletagmanager.com/gtag/js?id=" + id + "'><\/script>" +
        "<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','" + id + "');<\/script>"
      );
    })();
  </script>
  <style>
    :root { --ink: #111; --muted: #767676; --line: #e9e9e9; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { font-family: "Segoe UI", system-ui, sans-serif; background: #fff; color: var(--ink); }
    .gtm {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0.9rem 1rem 3rem;
      display: grid;
      gap: 1rem;
      grid-template-columns: minmax(16rem, 24rem) minmax(0, 1fr);
    }
    @media (max-width: 800px) { .gtm { grid-template-columns: 1fr; } }
    .gtm h2 { margin: 0 0 0.45rem; font-size: 1rem; }
    .gtm-note { margin: 0 0 0.85rem; font-size: 0.78rem; color: var(--muted); line-height: 1.45; }
    .gtm-fields { display: grid; gap: 0.75rem; }
    .gtm label { display: grid; gap: 0.28rem; font-size: 0.78rem; color: var(--muted); }
    .gtm select, .gtm input {
      font: inherit;
      color: var(--ink);
      padding: 0.45rem 0.5rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }
    .gtm-url {
      font: 650 0.68rem/1.4 ui-monospace, monospace;
      white-space: nowrap;
    }
    .gtm-stage {
      display: grid;
      place-items: center;
      min-height: 360px;
      padding: 1.2rem;
      border-radius: 16px;
      background: #c8c8c8;
      background-image: linear-gradient(#d8d8d8 1px, transparent 1px), linear-gradient(90deg, #d8d8d8 1px, transparent 1px);
      background-size: 16px 16px;
    }
    .gtm-stage iframe {
      display: block;
      border: 0;
      background: #111;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.28);
    }
    .gtm-warn {
      margin: 0.2rem 0 0;
      font-size: 0.72rem;
      color: #b42318;
      line-height: 1.35;
    }
    .gtm-ok { color: #087443; }
    body.is-gtm-assist .app-bar,
    body.is-gtm-assist .gtm > section:first-child { display: none; }
    body.is-gtm-assist .gtm {
      max-width: none;
      padding: 0;
      grid-template-columns: 1fr;
    }
    body.is-gtm-assist .gtm-stage {
      min-height: 100vh;
      border-radius: 0;
      padding: 0;
    }
  </style>
</head>
<body>
  <!--GTM_BODY-->
  <header class="app-bar is-sticky">
    <button type="button" class="app-burger" id="app-burger" aria-label="Abrir menú" aria-expanded="false" aria-controls="app-drawer">
      <span class="app-burger-lines" aria-hidden="true"><span></span><span></span><span></span></span>
    </button>
    <a class="app-brand" href="/index.html">Nexus Daily</a>
    <h1 class="app-page-title">GTM preview</h1>
    <div class="app-bar-end">
      <a class="app-quiet" href="/gwd-light.html">GWD ligero</a>
    </div>
  </header>
  <main class="gtm">
    <section>
      <h2>Tag Assistant</h2>
      <p class="gwd-note gtm-note">
        En GTM → Preview pegá la URL de abajo. Tiene que incluir
        <code>gtm=GTM-…</code> del mismo contenedor. Tag Assistant abre esta
        página en un iframe y no ve el ID si solo está en localStorage.
      </p>
      <div class="gtm-fields">
        <label>ID de GTM
          <input id="gtm-id" type="text" spellcheck="false" placeholder="GTM-XXXXXXX" autocomplete="off" />
        </label>
        <p class="gtm-warn" id="gtm-warn" hidden></p>
        <label>Anuncio publicado
          <select id="gtm-ad"></select>
        </label>
        <label>URL de preview
          <input id="gtm-url" class="gtm-url" type="text" readonly spellcheck="false" />
        </label>
      </div>
    </section>
    <section>
      <h2>Lienzo</h2>
      <div class="gtm-stage">
        <iframe id="gtm-frame" title="Anuncio GTM" hidden></iframe>
        <p class="gtm-miss" id="gtm-miss">Publicá un clímax en public/iframe para previsualizarlo.</p>
      </div>
    </section>
  </main>
  <script type="module">
    const GTM_KEY = "gwd-gtm-container";
    const params = new URLSearchParams(location.search);
    const assist = Boolean(params.get("gtm_preview") || params.get("gtm_debug") || params.get("gtm_auth"));
    if (assist) document.body.classList.add("is-gtm-assist");

    const sel = document.getElementById("gtm-ad");
    const frame = document.getElementById("gtm-frame");
    const miss = document.getElementById("gtm-miss");
    const urlOut = document.getElementById("gtm-url");
    const gtmId = document.getElementById("gtm-id");
    const warn = document.getElementById("gtm-warn");

    function validId(value) {
      const id = String(value || "").trim().toUpperCase();
      return /^(GTM|GT|G|AW)-[A-Z0-9]+$/.test(id) ? id : "";
    }

    function pathSlug() {
      const last = (location.pathname.replace(/\/+$/, "").split("/").pop() || "").replace(/\.html$/i, "");
      if (last && last !== "gtm") return last;
      return "";
    }

    function currentSlug() {
      return String(params.get("ad") || pathSlug() || "").replace(/\.html$/i, "");
    }

    function previewHref(slug, w, h) {
      const q = new URLSearchParams({ ad: slug });
      const id = validId(gtmId.value);
      if (w) q.set("w", String(w));
      if (h) q.set("h", String(h));
      if (id) q.set("gtm", id);
      return `${location.origin}/gtm.html?${q}`;
    }

    function markTag() {
      const id = validId(gtmId.value);
      const installed = Boolean(document.querySelector('script[src*="googletagmanager.com"]'));
      if (!id) {
        warn.hidden = false;
        warn.classList.remove("gtm-ok");
        warn.textContent = "Sin ID no hay Google tag. Tag Assistant se queda conectando. Poné el GTM- de tu contenedor, copiá de nuevo la URL y usá esa en Preview.";
        return;
      }
      warn.hidden = false;
      warn.classList.toggle("gtm-ok", installed);
      warn.textContent = installed
        ? `Google tag en esta página: ${id}`
        : `Guardá el ID y recargá. La URL de preview debe llevar gtm=${id} antes de abrir Tag Assistant.`;
    }

    async function sizeFromAd(src, fallback) {
      const w = Number(params.get("w")) || fallback.w;
      const h = Number(params.get("h")) || fallback.h;
      if (w && h) return { w, h };
      try {
        const html = await fetch(src, { cache: "no-store" }).then((res) => res.text());
        const match = html.match(/ad\.size["']\s+content=["']width=(\d+),height=(\d+)/i);
        if (match) return { w: Number(match[1]), h: Number(match[2]) };
      } catch { /* published html may still be missing */ }
      return { w: w || 300, h: h || 250 };
    }

    try {
      gtmId.value = validId(params.get("gtm")) || validId(localStorage.getItem(GTM_KEY)) || "";
    } catch {
      gtmId.value = validId(params.get("gtm")) || "";
    }

    gtmId.addEventListener("change", () => {
      gtmId.value = validId(gtmId.value);
      try {
        if (gtmId.value) localStorage.setItem(GTM_KEY, gtmId.value);
        else localStorage.removeItem(GTM_KEY);
      } catch { /* optional */ }
      syncUrl();
      markTag();
    });
    urlOut.addEventListener("focus", () => urlOut.select());
    urlOut.addEventListener("click", () => urlOut.select());

    let ads = [];
    try {
      const data = await fetch("/api/gtm-ads", { cache: "no-store" }).then((res) => res.json());
      ads = Array.isArray(data.ads) ? data.ads : [];
    } catch {
      ads = [];
    }

    const wanted = currentSlug();
    if (wanted && !ads.some((item) => item.slug === wanted)) {
      ads.unshift({ slug: wanted, file: `${wanted}.html`, src: `/public/iframe/${wanted}.html` });
    }

    sel.replaceChildren();
    if (!ads.length) {
      sel.append(new Option("No hay HTML en public/iframe", ""));
    } else {
      for (const item of ads) sel.append(new Option(item.slug, item.slug));
      sel.value = wanted && ads.some((item) => item.slug === wanted) ? wanted : ads[0].slug;
    }

    async function show(slug) {
      const item = ads.find((entry) => entry.slug === slug);
      if (!item) {
        frame.hidden = true;
        miss.hidden = false;
        urlOut.value = `${location.origin}/gtm.html`;
        markTag();
        return;
      }
      const size = await sizeFromAd(item.src, { w: Number(params.get("w")), h: Number(params.get("h")) });
      frame.width = size.w;
      frame.height = size.h;
      frame.src = item.src;
      frame.hidden = false;
      miss.hidden = true;
      urlOut.value = previewHref(item.slug, size.w, size.h);
      markTag();
    }

    function syncUrl() {
      const item = ads.find((entry) => entry.slug === sel.value);
      if (!item) return;
      urlOut.value = previewHref(item.slug, frame.width, frame.height);
    }

    sel.addEventListener("change", () => {
      if (!assist) {
        const next = previewHref(sel.value, params.get("w"), params.get("h"));
        history.replaceState(null, "", next.replace(location.origin, "") || "/gtm.html");
      }
      show(sel.value);
    });

    await show(sel.value);
  </script>
  <script src="/app-nav.js?v=nav2"></script>
</body>
</html>
