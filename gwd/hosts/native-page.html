<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="ad.size" content="width=300,height=250" />
  <title>Player nativo</title>
  <link rel="stylesheet" href="ad-play.css" />
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #111; }
    #gwd-slot { width: 100%; height: 100%; }
    body.gwd-ad .ad-label,
    body.gwd-ad .ad-hint { display: none; }
    .player-miss {
      margin: 0;
      padding: 1rem;
      color: #d8d0c4;
      font: 650 0.8rem/1.4 ui-sans-serif, system-ui, sans-serif;
      text-align: center;
    }
  </style>
</head>
<body class="player-embed gwd-ad">
  <div id="gwd-slot"></div>
  <script src="babylon-ads-player.js?v=tiny2"></script>
  <script>
    (async function () {
      var api = window.BabylonAdsPlayer;
      var host = document.getElementById("gwd-slot");
      if (!api || !api.mountPlay) {
        host.innerHTML = "<p class=\"player-miss\">Falta el player en public/player.</p>";
        return;
      }
      var query = new URLSearchParams(location.search);
      var hash = new URLSearchParams(String(location.hash || "").replace(/^#/, ""));
      var profileId = query.get("p") || hash.get("p") || "";
      var playId = query.get("id") || hash.get("id") || "";
      var meshUrl = query.get("glb") || hash.get("glb") || "";
      api.setPlayerOrigin(location.origin);
      var ok = await api.mountPlay(host, {
        profileId: profileId,
        playId: playId,
        slotId: "gwd-ad",
        origin: location.origin,
        meshUrl: meshUrl || undefined
      });
      if (!ok) {
        host.innerHTML = "<p class=\"player-miss\">Ese clímax no está en el perfil.</p>";
        return;
      }
      var box = host.querySelector(".ad-container");
      var w = getComputedStyle(host).getPropertyValue("--ad-w").trim() || "300px";
      var h = getComputedStyle(host).getPropertyValue("--ad-h").trim() || "250px";
      var meta = document.querySelector('meta[name="ad.size"]');
      if (meta) meta.setAttribute("content", "width=" + parseInt(w, 10) + ",height=" + parseInt(h, 10));
      if (box && api.startAd) await api.startAd(box);
    })();
  </script>
</body>
</html>
