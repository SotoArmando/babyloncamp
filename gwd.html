<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GWD · Player</title>
  <link rel="stylesheet" href="app-nav.css?v=nav3" />
  <style>
    :root { --ink: #111; --muted: #767676; --line: #e9e9e9; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { font-family: "Segoe UI", system-ui, sans-serif; background: #fff; color: var(--ink); }
    .gwd {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0.9rem 1rem 3rem;
      display: grid;
      gap: 1rem;
      grid-template-columns: minmax(16rem, 24rem) minmax(0, 1fr);
    }
    @media (max-width: 800px) { .gwd { grid-template-columns: 1fr; } }
    .gwd h2 { margin: 0 0 0.45rem; font-size: 1rem; }
    .gwd-note { margin: 0 0 0.85rem; font-size: 0.78rem; color: var(--muted); line-height: 1.45; }
    .gwd-fields { display: grid; gap: 0.75rem; }
    .gwd label {
      display: grid;
      gap: 0.28rem;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .gwd select {
      font: inherit;
      color: var(--ink);
      padding: 0.45rem 0.5rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }
    .gwd-url {
      margin: 0.75rem 0 0;
      padding: 0.55rem 0.65rem;
      border-radius: 8px;
      background: #f4f4f4;
      font: 650 0.7rem/1.4 ui-monospace, monospace;
      word-break: break-all;
    }
    .gwd-stage {
      display: grid;
      place-items: center;
      min-height: 360px;
      padding: 1.2rem;
      border-radius: 16px;
      background: #c8c8c8;
      background-image: linear-gradient(#d8d8d8 1px, transparent 1px), linear-gradient(90deg, #d8d8d8 1px, transparent 1px);
      background-size: 16px 16px;
    }
    .gwd-stage iframe {
      display: block;
      border: 0;
      background: #111;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.28);
    }
  </style>
</head>
<body>
  <header class="app-bar is-sticky">
    <button type="button" class="app-burger" id="app-burger" aria-label="Abrir menú" aria-expanded="false" aria-controls="app-drawer">
      <span class="app-burger-lines" aria-hidden="true"><span></span><span></span><span></span></span>
    </button>
    <a class="app-brand" href="index.html">Nexus Daily</a>
    <h1 class="app-page-title">GWD</h1>
    <div class="app-bar-end">
      <a class="app-quiet" href="gallery.html">Galería</a>
    </div>
  </header>
  <main class="gwd">
    <section>
      <h2>Anuncio tipo GWD</h2>
      <p class="gwd-note">
        El iframe es un documento IAB que solo usa <code>window.BabylonAdsPlayer</code>
        (<code>mountPlay</code> + <code>startAd</code>). Así se hospedaría el player dentro de Google Web Designer.
      </p>
      <div class="gwd-fields">
        <label>Perfil
          <select id="sel-profile"></select>
        </label>
        <label>Clímax
          <select id="sel-combo"></select>
        </label>
      </div>
      <p class="gwd-url" id="gwd-url"></p>
    </section>
    <section>
      <h2>Lienzo</h2>
      <div class="gwd-stage">
        <iframe id="gwd-frame" title="Anuncio GWD"></iframe>
      </div>
    </section>
  </main>
  <script type="module">
    import { loadServeStore } from "./ad-profile.js?v=cam26";
    import { formatById } from "./ad-catalog.js?v=cam23";
    import { listGalleryPlays, listProfiles, comboPlayLabel } from "./play-route.js?v=8";

    const store = await loadServeStore();
    const selProfile = document.getElementById("sel-profile");
    const sel = document.getElementById("sel-combo");
    const frame = document.getElementById("gwd-frame");
    const urlOut = document.getElementById("gwd-url");
    let items = [];

    for (const profile of listProfiles(store)) {
      selProfile.append(new Option(profile.name, profile.id));
    }
    selProfile.value = store.activeId || listProfiles(store)[0]?.id || "";

    function adHref(id, profileId) {
      const parts = [];
      if (profileId) parts.push(`p=${encodeURIComponent(profileId)}`);
      parts.push(`id=${encodeURIComponent(id)}`);
      return `gwd-ad.html#${parts.join("&")}`;
    }

    function fillCombos() {
      items = listGalleryPlays(store, selProfile.value);
      sel.replaceChildren();
      if (!items.length) {
        sel.append(new Option("No hay clímaxes en este perfil", ""));
        return;
      }
      for (const item of items) sel.append(new Option(comboPlayLabel(item), item.id));
    }

    function loadFrame(href) {
      const go = () => { frame.src = href; };
      if (frame.getAttribute("src")) {
        frame.onload = () => go();
        frame.src = "about:blank";
        return;
      }
      go();
    }

    function sync() {
      const item = items.find((entry) => entry.id === sel.value);
      if (!item) {
        urlOut.textContent = "Elegí un clímax en la galería y volvé.";
        frame.removeAttribute("src");
        return;
      }
      const href = adHref(item.id, selProfile.value);
      const format = formatById(item.ad);
      urlOut.textContent = href;
      frame.width = format.w;
      frame.height = format.h;
      if (frame.dataset.href !== href) {
        frame.dataset.href = href;
        loadFrame(href);
      }
    }

    selProfile.addEventListener("change", () => {
      fillCombos();
      sync();
    });
    sel.addEventListener("change", sync);
    fillCombos();
    sync();
  </script>
  <script src="app-nav.js?v=nav2"></script>
</body>
</html>
